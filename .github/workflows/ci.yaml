name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  linters:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install tox

    - name: Run linters
      run: tox -e linters

  tests:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        bash .github/workflows/script/ubuntu_dep.sh
        bash .github/workflows/script/python_dep.sh
        pip install tox

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build native extension in place
      run: |
        python -m pip install setuptools setuptools-rust setuptools_scm
        python setup.py build_ext --inplace

    - name: Build native routing bridge
      run: |
        sudo apt-get install -y cmake zlib1g-dev
        python -m pip install pybind11
        cmake -S native/routing -B build/native-routing \
          -DCMAKE_BUILD_TYPE=Release \
          -DPython3_EXECUTABLE="$(command -v python)" \
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
        cmake --build build/native-routing --parallel 4

    - name: Test native routing bridge
      env:
        SAILWORKS_NATIVE_ROUTING_BUILD: ${{ github.workspace }}/build/native-routing/python
      run: |
        ctest --test-dir build/native-routing --output-on-failure
        python -m pytest test/test_native_routing_import.py test/test_native_routing_smoke.py \
          test/test_native_routing_cancellation.py test/test_native_routing_adapter.py -q

    - name: Run tests
      env:
        SAILWORKS_EXPECT_NATIVE_GEOMETRY: "1"
        SAILWORKS_NATIVE_ROUTING_BUILD: ${{ github.workspace }}/build/native-routing/python
      run: |
        sudo apt-get install -y xvfb xauth
        xvfb-run -a tox -e unit-tests
