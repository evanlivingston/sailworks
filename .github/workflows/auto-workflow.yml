# Auto-workflow: Automated bug fixing and optimization
# Runs on schedule to find and fix issues in the codebase

name: Auto Workflow

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      max_issues:
        description: 'Maximum issues to process per run'
        required: false
        default: '1'
        type: string
      dry_run:
        description: 'Run discovery only, no implementation'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  # Python/UV setup
  UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
  # Git config
  GIT_AUTHOR_NAME: 'auto-workflow[bot]'
  GIT_AUTHOR_EMAIL: 'auto-workflow@users.noreply.github.com'
  GIT_COMMITTER_NAME: 'auto-workflow[bot]'
  GIT_COMMITTER_EMAIL: 'auto-workflow@users.noreply.github.com'

jobs:
  auto-workflow:
    name: Auto Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: auto-workflow
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install open-code-review

      - name: Configure Git
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

      - name: Set up OpenCodeReview
        run: |
          mkdir -p ~/.opencodereview
          cat > ~/.opencodereview/config.json << 'EOF'
          {
            "llm": {
              "provider": "anthropic",
              "model": "claude-3-5-sonnet-20241022",
              "api_key": "${{ secrets.ANTHROPIC_API_KEY }}"
            }
          }
          EOF
        if: env.ANTHROPIC_API_KEY != ''

      - name: Run auto-workflow
        id: workflow
        run: |
          cd ${{ github.workspace }}
          python tools/auto_workflow/main.py \
            --run-id "gha-${{ github.run_id }}-${{ github.run_number }}" \
            --max-issues ${{ github.event.inputs.max_issues || 1 }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-workflow-logs
          path: tools/auto_workflow/logs/
          retention-days: 7

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.number || 0 }},
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.number || 0 }},
              body: `❌ **Auto-workflow failed**\n\nRun: ${{ github.run_id }}\nWorkflow: ${{ github.workflow }}\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            });

  # Separate job for manual trigger with custom params
  manual-trigger:
    name: Manual Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch'
    needs: auto-workflow
    steps:
      - name: Trigger completed
        run: echo "Manual trigger completed"

# Allow running on specific branches for testing
on:
  push:
    branches: [auto-workflow-test]