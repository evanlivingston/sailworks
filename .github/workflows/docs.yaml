name: docs

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install sphinx pydata-sphinx-theme sphinx_design myst_parser
      - name: Check documentation links and anchors
        run: |
          python tools/check_doc_links.py
          python tools/check_doc_anchors.py
      - name: Sphinx build
        run: |
          sphinx-build -W docs/source docs/build/html
      - name: Check manual screenshots match manifest
        run: |
          python tools/capture_manual.py --check
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          force_orphan: true
