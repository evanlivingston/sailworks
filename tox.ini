[tox]
envlist = linters,unit-tests
requires =
    tox>=4.21

[testenv]
; Nothing is hand-listed here. tox installs the project, so the runtime
; dependencies come from [project].dependencies in pyproject.toml, and the
; test-only ones come from the PEP 735 "test" dependency group.
; Linters do not need either, so packaging is off by default.
skip_install = true
pass_env =
    SAILWORKS_EXPECT_NATIVE_GEOMETRY
commands =
    python -I -m build --wheel -C=--build-option=-- -C=--build-option=-- -C=--build-option=-j4


[testenv:coverage]
allowlist_externals = bash
skip_install = false
dependency_groups = test
commands_pre =
    bash -c 'pip install gdal[numpy]==$(gdal-config --version).*'
commands =
    pytest --cov-report term-missing --cov-report html --cov-report xml --cov=sailworks


[testenv:unit-tests]
allowlist_externals = bash
skip_install = false
dependency_groups = test
commands_pre =
    bash -c 'pip install gdal[numpy]==$(gdal-config --version).*'
commands =
    pytest #-rP


[testenv:flake8]
deps =
    ; {[testenv]deps}
    flake8
commands =
    flake8 ./sailworks

[testenv:isort]
deps =
    ; {[testenv]deps}
    isort
commands =
    isort .

[testenv:black]
deps =
    ; {[testenv]deps}
    black[jupyter]
commands =
    black .

[testenv:typecheck]
; allowlist_externals = mypy # TODO: why?
deps =
    ; {[testenv]deps}
    mypy
    types-setuptools
    types-requests
    types-python-dateutil
commands =
    mypy ./sailworks

[testenv:linters]
deps =
    #{[testenv:isort]deps}
    {[testenv:black]deps}
    {[testenv:flake8]deps}
commands =
    #{[testenv:isort]commands}
    {[testenv:black]commands}
    {[testenv:flake8]commands}
