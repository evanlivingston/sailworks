# Automated Workflow Configuration
# Copy to config.local.yaml and modify for local overrides

schedule:
  cron: "0 2 * * *"  # Daily at 2 AM UTC
  timezone: "UTC"
  enabled: true

discovery:
  ocr_enabled: true
  static_analysis_enabled: true
  test_analysis_enabled: true
  pattern_mining_enabled: true
  perf_regression_enabled: true

  # OCR specific
  ocr_model: "auto"  # Uses OpenCodeReview's configured model
  ocr_concurrency: 4
  ocr_timeout_minutes: 30
  ocr_compare_base: "origin/dev"  # Base ref for OCR comparison
  ocr_exclude_patterns: [
    "*.pol", "*.svg", "*.gpx", "*.json", "*.md",
    "test/fixtures/**", "docs/profiles/**", "build/**",
    "*.pyc", "__pycache__/**", ".git/**"
  ]

  # Static analysis
  pylint_enabled: true
  mypy_enabled: true
  bandit_enabled: true
  radon_enabled: true
  complexity_threshold: 15  # Cyclomatic complexity warning

  # Test analysis
  test_timeout_seconds: 120
  flaky_test_runs: 3
  slow_test_threshold_seconds: 10

  # Pattern mining
  todo_patterns: ["TODO", "FIXME", "HACK", "XXX", "BUG"]
  deprecated_patterns: ["deprecated", "legacy", "obsolete"]

  # Performance regression
  benchmark_baseline_dir: "docs/profiles/rendering"
  regression_threshold_percent: 10

implementation:
  max_issues_per_run: 1
  subagent_tier: "medium"  # fast, medium, heavy
  max_implementation_minutes: 30
  worktree_slug_prefix: "auto"
  commit_message_template: |
    {type}: {title}

    {description}

    Automated fix by auto-workflow (run: {run_id})
    Issue: {issue_id}

review:
  ocr_max_iterations: 5
  ocr_blocker_threshold: "major"  # blocker, major, minor, suggestion
  ocr_auto_fix_types: ["blocker", "major"]
  ocr_skip_types: ["suggestion"]
  fix_subagent_tier: "medium"
  max_fix_minutes_per_iteration: 15

merge:
  auto_merge: true
  merge_method: "squash"  # squash, merge, rebase
  require_tests_pass: true
  require_ocr_clean: true
  require_ci_pass: false  # No CI configured yet
  merge_timeout_minutes: 10

worktree:
  base_path: "~/wt"
  prune_on_start: true
  prune_on_end: true
  keep_merged_worktrees_hours: 24

state:
  file: "tools/auto_workflow/state.json"
  lock_file: "tools/auto_workflow/.lock"
  lock_timeout_minutes: 5
  max_state_age_days: 30

logging:
  level: "INFO"
  dir: "tools/auto_workflow/logs"
  retention_days: 7
  json_format: true

github:
  repo: "evanlivingston/sailworks"
  base_branch: "dev"
  pr_labels: ["automated", "auto-workflow"]
  pr_assignees: []
  pr_reviewers: []