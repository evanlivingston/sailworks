[project]
name = "sailworks"
dynamic = ["version"]
description = "Sailing routing and navigation software"
readme = "README.md"
requires-python = ">= 3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Davide Gessa", email = "gessadavide@gmail.com"},
]
maintainers = [
    {name = "Sailworks contributors"},
]
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "pycairo",
    "requests",
    "cdsapi>=0.7,<1",
    "keyring>=25,<26",
    "copernicusmarine>=2.2,<3",
    "colorlog",
    "geojson_utils",
    "bs4",
    "pyserial",
    "pynmea2",
    "gpxpy",
    "numpy",
    "netCDF4>=1.6",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "nmeatoolkit>=0.2",
    "appdirs",
    "matplotlib",
    "weatherrouting>=0.2.1",
    "GDAL[numpy];sys_platform == 'darwin'",
    #"GDAL[numpy]==3.8.4;sys_platform == 'linux'",
    "GDAL[numpy];sys_platform == 'win32'"
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
qt = [] # Compatibility extra: Qt is now installed by default.
marine-global = ["copernicusmarine>=2.2,<3"]
weathernext = ["xarray", "zarr>=3", "gcsfs", "dask[array]"]

[dependency-groups]
dev = ["black", "pytest", "pytest-qt"]

[project.urls]
Homepage = "https://github.com/evanlivingston/sailworks"
"Bug Tracker" = "https://github.com/evanlivingston/sailworks/issues/"
Documentation = "https://github.com/evanlivingston/sailworks#readme"
Source = "https://github.com/evanlivingston/sailworks"

[project.scripts]
sailworks = "sailworks.__main__:main"
sailworks-qt = "sailworks.qt.__main__:main"

[tool.setuptools]
packages = [
    "sailworks",
    "sailworks.core",
    "sailworks.core.utils",
    "sailworks.core.geo",
    "sailworks.core.gribsources",
    "sailworks.core.marine",
    "sailworks.common",
    "sailworks.qt",
    "sailworks.rendering",
    "sailworks.rendering.vectordrawer",
]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "sailworks.__version__" }

[tool.setuptools.package-data]
sailworks = [
    "data/*",
    "data/boats/*",
    "data/polars/*",
    "data/symbols/*",
    "data/s57/*",
    "data/icons/*",
    "qt/shaders/*.qml",
    "qt/shaders/*.frag",
    "qt/shaders/*.vert",
    "qt/shaders/*.comp",
    "qt/shaders/*.qsb",
]

[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["network: opt-in tests downloading live forecasts (GWR_NETWORK_TESTS=1)"]
